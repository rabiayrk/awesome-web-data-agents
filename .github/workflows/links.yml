name: Links

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --cache --max-cache-age 1d readme.md contributing.md maintenance.md evaluation.md
          fail: ${{ github.event_name == 'pull_request' }}
      - name: Open issue for broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          labels: broken-links
